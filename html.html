<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpg" href="fotos/header_dactiMex.png">
    <meta name="theme-color" content="#ff00b8">
    <title>dactimex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="anuncio">
        <h1>¡Bienvenid@ a dactimex!</h1>
        <img id="gestos" src="fotos/gestos.jpg"> 
        <p>Dactimex es capaz de clasificar los 29 gestos mostrados en la imagen superior haciendo uso de 
            tu webcam. El sistema se encargará de mostrar lo que quieres decir en pantalla. -Osval Valladares
        </p>
        <button id="continuar" class="buttons">CONTINUAR</button>
    </div>
    <div  id="daWholeThing">
        <h3 id="timer"></h3>
        <img src="fotos/frame.png"; class="frame">
        <div id="camera-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
        </div>
        <img src="fotos/frame.png"; class="frame">
        <div id="result-box">Esperando cámara...</div>
        <div id="confidence-box"></div>
        <br>
        <button id="pause-button" onclick="clicked(true)" class="buttons">⏸</button>
        <button id="reset-button" onclick="clicked(false)" class="buttons"">🗘</button>
    </div>
    <script>
        const interval = 2000;
        const timer = document.getElementById('timer');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const resultBox = document.getElementById('result-box');
        const confidenceBox = document.getElementById('confidence-box');
        const pauseButton = document.getElementById('pause-button');
        const continuarButton = document.getElementById('continuar');
        const anuncio = document.getElementById('anuncio');
        const container = document.getElementById('daWholeThing');
        let isProcessing = false;
        let isPaused = true;
        
        continuarButton.addEventListener('click', (event) => {
            event.preventDefault();
            isPaused = !isPaused;
            anuncio.style.display = 'none';
            container.style.display = 'inline-block';
        });

        function clicked(toPause) {
            if(toPause) {
                isPaused = !isPaused;
                pauseButton.textContent = isPaused ? "▶" : "⏸";
            } else {
                resultBox.textContent = '';
                confidenceBox.textContent = '';
            }
        }

        // Camera
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { 
                video.srcObject = stream; 
                resultBox.innerText = ""; 
                let innterInterval = interval;
                setInterval(() => {
                    if (innterInterval >= 1000) {
                        timer.innerHTML =`La próxima captura será tomada dentro de ${innterInterval/1000} segundos`;
                        innterInterval -= 1000;
                    } else {
                        timer.innerHTML = 'Prediciendo...';
                        captureAndPredict(); 
                        innterInterval = interval;
                    }
                     if(isPaused) {
                        timer.innerHTML = 'Procesamiento en pausa' 
                    }  
                }, 1000);
            })
            .catch(err => { 
                console.error("Error de cámara:", err); 
                resultBox.innerText = "No se pudo acceder a la cámara"; 
            });

        // Capture
        function captureAndPredict() {
            if (isProcessing) return;

            isProcessing = true;
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;
            tempCanvas.getContext('2d').drawImage(video, 0, 0);
            tempCanvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('image', blob, 'capture.jpg');
                fetch('https://dactilologiamexicana.onrender.com/predict', {
                // fetch('http://127.0.0.1:10000/predict', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if(data.error) {
                        resultBox.innerText = "Error: " + data.error;
                    } else {
                        if(data.class == '_' && !isPaused) clicked(false);
                        else if(data.class == '!') clicked(true);
                        else if(!isPaused && data.class === 'None') confidenceBox.innerText = data.confidence
                        else if(!isPaused) {
                            resultBox.innerHTML += data.class.toUpperCase();
                            confidenceBox.innerHTML = `Confianza: ${data.confidence}`;
                        }
                            
                    }
                })
                .catch(err => {
                    console.error("Error:", err);
                    resultBox.innerText = "Error con el servidor";
                })
                .finally(() => {
                    isProcessing = false;
                });
            }, 'image/jpeg', 0.6);
        }
    </script>
</body>
</html>
