<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpg" href="fotos/header_dactiMex.png">
    <meta name="theme-color" content="#ff00b8">
    <title>dactimex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="anuncio">
        <h1>¡Bienvenid@ a dactimex!</h1>
        <img id="gestos" src="fotos/gestos.png"> 
        <p>Dactimex es capaz de clasificar los 29 gestos mostrados en la imagen superior haciendo uso de 
            tu webcam. Asegúrate de mostrar claramente tu mano. -Osval Valladares
        </p>
        <button id="continuar" class="buttons">CONTINUAR</button>
    </div>
    <div id="daWholeThing">
        <h3 id="timer"></h3>
        <img src="fotos/frame.png"; class="frame">
        <div id="camera-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
        </div>
        <img src="fotos/frame.png"; class="frame">
        <div id="result-box">Esperando cámara...</div>
        <div id="confidence-box"></div>
        <br>
        <button id="pause-button" onclick="clicked(true)" class="buttons">⏸️</button>
        <button id="reset-button" onclick="clicked(false)" class="buttons"">🔄</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
