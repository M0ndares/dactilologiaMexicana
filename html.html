<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpg" href="header_dactiMex.png">
    <meta name="theme-color" content="#ff00b8">
    <title>Dactilología Mexicana</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; }
        #camera-container { position: relative; display: inline-block; margin-top: 20px; border: 4px solid #333; border-radius: 10px; overflow: hidden; }
        video { width: 100%; max-width: 25rem; display: block; }
        #result-box { margin-top: 20px; font-size: 1.5rem; font-weight: bold; color: #333; min-height: 50px; }
    </style>
</head>
<body style="background-color: #ff00b8;">
    <h3 id="timer" style="color: #f0f2f5;"></h3>
    <img src="frame.png"; style= "max-height: 20rem;">
    <div id="camera-container" style="border-color: #f0f2f5;">
        <video id="video" autoplay playsinline></video>
    </div>
    <img src="frame.png"; style= "max-height: 20rem;">
    
    <div id="result-box" style="color: #f0f2f5; text-align: center;">Esperando cámara...</div>
    <div id="confidence-box" style="color: #f0f2f5;"></div>
    <br>
    <button id="pause-button" onclick="clicked(true)" style="background-color:#f0f2f5; max-width: rem; cursor: pointer; color: #ff00b8;">⏸</button>
    <button id="reset-button" onclick="clicked(false)" style="background-color:#f0f2f5; max-width: rem; cursor: pointer; color: #ff00b8;">🗘</button>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const interval = 3000;
        const timer = document.getElementById('timer');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const resultBox = document.getElementById('result-box');
        const confidenceBox = document.getElementById('confidence-box');
        const pauseButton = document.getElementById('pause-button');

        let isProcessing = false;
        let isPaused = false;
        
        function clicked(state) {
            if(state) {
                isPaused = !isPaused;
                if(isPaused) pauseButton.textContent = '▶';
                else pauseButton.textContent = '⏸';
            } else {
                resultBox.textContent = ''
                confidenceBox.textContent = ''
            }
        }

        // Camera
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { 
                video.srcObject = stream; 
                resultBox.innerText = ""; 
                let innterInterval = interval;
                setInterval(() => {
                    if(!isPaused) {
                        if (innterInterval >= 1000) {
                            timer.innerHTML =`La próxima captura será tomada dentro de ${innterInterval/1000} segundos`;
                            innterInterval -= 1000;
                        } else {
                            timer.innerHTML = 'Prediciendo...';
                            captureAndPredict(); 
                            innterInterval = interval;
                        }

                    }
                }, 1000);
            })
            .catch(err => { 
                console.error("Error de cámara:", err); 
                resultBox.innerText = "No se pudo acceder a la cámara"; 
            });

        // Capture
        function captureAndPredict() {
            // If not available
            if (isProcessing || isPaused) return;

            isProcessing = true;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('image', blob, 'capture.jpg');

                // Delivering
                fetch('https://dactilologiamexicana.onrender.com/predict', {
                // fetch('http://127.0.0.1:10000/predict', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if(data.error) {
                        resultBox.innerText = "Error: " + data.error;
                    } else {
                        if(data.class == '_') resultBox.innerHTML = '';
                        else resultBox.innerHTML += data.class.toUpperCase();
                        confidenceBox.innerHTML = `Confianza: ${data.confidence}`;
                    }
                })
                .catch(err => {
                    console.error("Error:", err);
                    resultBox.innerText = "Error con el servidor";
                })
                .finally(() => {
                    isProcessing = false;
                });
            }, 'image/jpeg', 0.6);
        }
    </script>
</body>
</html>
